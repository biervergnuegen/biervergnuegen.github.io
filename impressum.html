<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressum | Biervergnügen</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --copper: #b87333; --dark-malt: #1a0f0a; --light-gold: #e5c185; --text: #f5f5f5; }
        body { margin: 0; background-color: var(--dark-malt); color: var(--text); font-family: 'Montserrat', sans-serif; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        nav { display: flex; justify-content: center; padding: 2rem 1rem; gap: 2rem; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; }
        nav a { color: var(--text); text-decoration: none; transition: color 0.3s; }
        nav a:hover { color: var(--copper); }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; flex: 1; }
        h1 { font-family: 'Playfair Display', serif; color: var(--light-gold); border-bottom: 1px solid var(--copper); padding-bottom: 1rem; }
        h2 { color: var(--copper); margin-top: 2rem; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .legal-content { background: rgba(255, 255, 255, 0.03); padding: 2rem; border: 1px solid rgba(184, 115, 51, 0.1); }
        footer { text-align: center; padding: 3rem; opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav><a href="index.html">Zurück zur Startseite</a></nav>

            </p>

            </p>

            <h2>Redaktionell verantwortlich</h2>
            <p>Markus Borgschulte</p>

        </div>
    </div>
    <footer>&copy; 2026 Biervergnügen</footer>
</body>
</html>
