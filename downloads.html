<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads | Biervergnügen</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --copper: #b87333;
            --dark-malt: #1a0f0a;
            --light-gold: #e5c185;
            --text: #f5f5f5;
        }

        body {
            margin: 0;
            background-color: var(--dark-malt);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 2rem 1rem;
            gap: 1rem 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        nav a { color: var(--text); text-decoration: none; transition: color 0.3s; }
        nav a:hover { color: var(--copper); }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
            flex: 1;
            text-align: center;
        }

        h1 { font-family: 'Playfair Display', serif; color: var(--light-gold); font-size: 3rem; margin-bottom: 1rem; }
        .subtitle { color: var(--copper); text-transform: uppercase; letter-spacing: 4px; font-size: 0.9rem; margin-bottom: 3rem; }

        .password-box {
            background: rgba(184, 115, 51, 0.05);
            border: 1px solid rgba(184, 115, 51, 0.2);
            padding: 3rem 2rem;
            margin-top: 2rem;
        }

        input[type="password"] {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--copper);
            color: white;
            padding: 1rem;
            font-size: 1.2rem;
            width: 100%;
            max-width: 300px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .btn-gold {
            background: none;
            border: 1px solid var(--copper);
            color: var(--copper);
            padding: 1rem 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s;
            font-size: 1rem;
        }

        .btn-gold:hover {
            background: var(--copper);
            color: var(--dark-malt);
        }

        #error-msg {
            color: #ff4444;
            margin-top: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        footer { text-align: center; padding: 3rem; opacity: 0.6; font-size: 0.8rem; }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            input[type="password"], .btn-gold { width: 100%; max-width: none; font-size: 1.2rem; padding: 1.2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="mich.html">Über mich</a>
        <a href="braukunst.html">Braukunst</a>
        <a href="sensorik.html">Verkostung</a>
        <a href="downloads.html" style="color: var(--copper);">Downloads</a>
    </nav>

    <div class="container">
        <h1>Downloads</h1>
        <div class="subtitle">Exklusiver Bereich für Kursteilnehmer</div>

        <p>Bitte gib das Passwort ein, das du im Kurs erhalten hast, um auf die Unterlagen zuzugreifen.</p>

        <div class="password-box">
            <input type="password" id="passInput" placeholder="Passwort eingeben">
            <br>
            <button class="btn-gold" onclick="checkPassword()">Inhalte anzeigen</button>
            <p id="error-msg">Falsches Passwort. Bitte versuch es erneut.</p>
        </div>
    </div>

    <footer>
        &copy; 2026 Biervergnügen
    </footer>

    <script>
        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            const error = document.getElementById('error-msg');
            
            // Hier dein gewünschtes Passwort eintragen (z.B. "Hopfen2026")
            if (pass === "Biervergnuegen2026") {
                // Wenn korrekt, leite zu einer versteckten Seite weiter
                // Du müsstest eine Datei namens "geheim-unterlagen.html" erstellen
                window.location.href = "geheim-unterlagen.html"; 
            } else {
                error.style.display = "block";
            }
        }

        // Enter-Taste zum Absenden ermöglichen
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
