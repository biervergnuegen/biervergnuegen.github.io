<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursunterlagen | Biervergnügen</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --copper: #b87333; --dark-malt: #1a0f0a; --light-gold: #e5c185; --text: #f5f5f5; }
        body { margin: 0; background-color: var(--dark-malt); color: var(--text); font-family: 'Montserrat', sans-serif; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        nav { display: flex; justify-content: center; padding: 2rem 1rem; gap: 2rem; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; }
        nav a { color: var(--text); text-decoration: none; transition: color 0.3s; }
        nav a:hover { color: var(--copper); }

        .container { max-width: 800px; margin: 0 auto; padding: 2rem; flex: 1; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; color: var(--light-gold); font-size: 2.5rem; margin-bottom: 2rem; }

        .file-card {
            background: rgba(184, 115, 51, 0.05);
            border-left: 4px solid var(--copper);
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .file-info h3 { margin: 0; color: var(--light-gold); font-size: 1.1rem; }
        .file-info p { margin: 5px 0 0; font-size: 0.85rem; opacity: 0.7; }
        
        .download-link {
            color: var(--copper);
            text-decoration: none;
            font-weight: bold;
            border: 1px solid var(--copper);
            padding: 0.5rem 1rem;
            transition: all 0.3s;
        }
        .download-link:hover { background: var(--copper); color: var(--dark-malt); }

        footer { text-align: center; padding: 3rem; opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="downloads.html">Zurück zum Login</a>
    </nav>

    <div class="container">
        <h1>Deine Kursunterlagen</h1>
        <p>Schön, dass du beim Braukurs dabei warst! Hier findest du alle versprochenen Dokumente.</p>

        <div class="file-card">
            <div class="file-info">
                <h3>Das Beispielrezept</h3>
                <p>PDF | Ein gut bewertetes Helles von Malz Maische und Mehr </p>
            </div>
            <a href="unterlagen/mmumHausbierHell.pdf" class="download-link" download>Download</a>
        </div>

        <div class="file-card">
            <div class="file-info">
                <h3>Weietes</h3>
                <p>PDF | Folgt...</p>
            </div>
            <a href="unterlagen/info.txt" class="download-link" download>Download</a>
        </div>
    </div>

    <footer>&copy; 2026 Biervergnügen</footer>
</body>
</html>
